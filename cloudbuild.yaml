steps:
  # Step 1: Setup Python and collect static files
  - name: 'python:3.11'
    entrypoint: 'bash'
    env:
      - 'DJANGO_SETTINGS_MODULE=your_project.settings'  # <-- change this
      - 'GS_BUCKET_NAME=django-static-mahesh-app123'            # used in collectstatic
      - 'DJANGO_SECRET_KEY=dummy'
      - 'DJANGO_DEBUG=False'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        python manage.py collectstatic --noinput

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t', 'us-central1-docker.pkg.dev/django-deploy-demo/django-repo/django-app:$SHORT_SHA', '.'
    ]

  # Step 3: Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 'us-central1-docker.pkg.dev/django-deploy-demo/django-repo/django-app:$SHORT_SHA'
    ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'django-app',
      '--image', 'us-central1-docker.pkg.dev/django-deploy-demo/django-repo/django-app:$SHORT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--set-secrets', 'DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,DJANGO_DEBUG=DJANGO_DEBUG:latest,GS_BUCKET_NAME=GS_BUCKET_NAME:latest'
    ]

images:
  - 'us-central1-docker.pkg.dev/django-deploy-demo/django-repo/django-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
